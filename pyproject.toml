[project]
name = "cruessler-github-io"
version = "0.1.0"
description = "A blog where I infrequently post performance analyses of gitoxide"
readme = "README.md"
authors = [
    { name = "Christoph Rüßler", email = "christoph.ruessler@mailbox.org" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
